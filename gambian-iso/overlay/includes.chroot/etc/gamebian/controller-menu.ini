# Gamebian controller quick menu — hotkey opens a fullscreen launcher.
# Override per user: ~/.config/gamebian/controller-menu.ini
#
# trigger mode:
#   guide         — Xbox Guide / PS / Mode (BTN_MODE) or KEY_HOMEPAGE
#   select_start  — hold Select, press Start (or the reverse)
#
# keyboard_super — if true (default), Super / Windows key also opens the menu.
#
# skip_when_steam_running — if true (default), hotkeys do nothing in the exclusive
#   gamescope Steam kiosk, and while Steam Big Picture runs on the Openbox desktop.
#
# [ui] theme: auto (installed = monochrome, live ISO = blue), installed, live
# icon: auto (menu-icon-default.png on disk, menu-icon.png on live), or full path
# title: window / header label (default Gamebian)

[trigger]
mode = guide
keyboard_super = true
skip_when_steam_running = true

[ui]
theme = auto
icon = auto
title = Gamebian

# Each "Label = command" appears in the main menu (shell one-liner or internal token).
# Themes opens a second menu with color themes and wallpaper previews (installed disk).
[programs]
Steam = /usr/sbin/gamebian-enter-steam-kiosk-session
Themes = __gamebian_themes_submenu__
Log Out = gamebian-session-action logout
Reboot = gamebian-session-action reboot
Shut Down = gamebian-session-action shutdown

[icons]
Steam = steam
Themes = preferences-desktop-theme
Log Out = system-log-out
Reboot = system-reboot
Shut Down = system-shutdown

# Color themes (green, yellow, blue, red, purple, black) — submenu only, not listed here.
[themes]
enabled = true
