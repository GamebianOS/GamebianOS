# GamebianUbuntu Calamares partition module.
# Erase must create a formatted ext4 root; explicit layout avoids empty job queues
# when UDisks2 has not fully probed the target disk yet.
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 300MiB
  minimumSize: 32MiB
  label: "EFI"

userSwapChoices:
  - none
  - small
  - suspend

# Apply erase layout as soon as the partition page opens (after disk probe).
initialPartitioningChoice: erase
initialSwapChoice: none

luksGeneration: luks1
defaultFileSystemType: "ext4"
drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Install target must have at least this much space (GiB).
requiredStorage: 10

lvm:
  enable: false

# Explicit root layout for erase / replace autopartition (Calamares 3.3.x).
partitionLayout:
  - name: "GamebianOS"
    filesystem: "ext4"
    mountPoint: "/"
    size: "100%"
