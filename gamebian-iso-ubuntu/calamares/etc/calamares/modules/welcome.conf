---
# Blocks “Next” until RAM and live internet checks pass (APT + shellprocess installers
# need a reachable Ubuntu mirror). Do not require `storage` here — on a live ISO that
# check measures overlay/tmp space (~1 GiB), not the install disk; partition module
# validates target disks. Join Wi‑Fi first (nm-tray / nm-connection-editor) if needed.

showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredRam: 1.5
  internetCheckUrl:
    - https://www.ubuntu.com/
    - https://archive.ubuntu.com/
    - https://networkcheck.kde.org/

  check:
    - ram
    - internet

  required:
    - ram
    - internet

geoip:
  style: "none"
