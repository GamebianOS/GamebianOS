---
# Live images may ship /etc/ssh/sshd_not_to_be_run; remove before enabling units.
# Strip live-only LightDM autologin drop-in.
# Installed disk: strip live/legacy LightDM drop-ins, install and bootstrap Steam,
# then enable gamescope autologin (gamebian-enable-steam-lightdm-session).
# Ensure default host keys exist (avoids "no hostkeys available"). gamebian-enable-sshd-installed
# creates /run/sshd before sshd -t (Calamares chroot has not run systemd-tmpfiles yet).
dontChroot: false
# Allow apt install of openssh-* / steam if slim squashfs omitted them.
timeout: 1800

script:
  - command: "rm -f /etc/ssh/sshd_not_to_be_run"
  - command: "rm -f /etc/lightdm/lightdm.conf.d/50-gamebian-live-autologin.conf"
  # Installed disk: keep 98-gamebian-autologin.conf; autologin → gamescope when Steam is installed.
  - command: "rm -f /etc/lightdm/lightdm.conf.d/88-gamebian-openbox-session.conf /etc/lightdm/lightdm.conf.d/99-gamebian-steam-session.conf /etc/lightdm/lightdm.conf.d/90-gamebian-openbox-first-session.conf /etc/lightdm/lightdm.conf.d/97-gamebian-autologin-steam.conf /etc/lightdm/lightdm.conf.d/99-gamebian-autologin-steam.conf"
  - command: "chmod 0755 /usr/bin/steamos-session-select /usr/sbin/gamebian-enter-steam-kiosk-session 2>/dev/null || true"
  - command: "chmod 0755 /usr/local/bin/gamebian-steam-gamescope-session /usr/local/bin/gamebian-steam-bigpicture /usr/local/bin/gamebian-autologin-session /usr/local/bin/gamebian-fix-steam-boot 2>/dev/null || true"
  - command: "chmod 0755 /usr/local/bin/gamebian-session-action /usr/local/sbin/gamebian-remove-installed-desktop.sh 2>/dev/null || true"
  - command: "/usr/local/sbin/gamebian-remove-installed-desktop.sh"
  - command: "chmod 0644 /usr/share/gamebian/gamebian-session-log.sh /usr/share/gamebian/gamebian-steam-gamescope-env.sh /etc/lightdm/lightdm.conf.d/10-gamebian-lightdm-debug.conf 2>/dev/null || true"
  - command: "chmod 0644 /usr/share/gamebian/gamebian-steam-ready.sh 2>/dev/null || true"
  - command: "chmod 0644 /usr/share/gamebian/xsessions/*.desktop 2>/dev/null || true"
  - command: "chmod 0755 /usr/local/sbin/gamebian-install-gamescope /usr/local/sbin/gamebian-install-steam /usr/local/sbin/gamebian-install-libretro-mupen64plus-next /usr/local/sbin/gamebian-install-libretro-dolphin 2>/dev/null || true"
  - command: "/usr/local/sbin/gamebian-add-user-input-group.sh"
  # Steam package + client bootstrap (not on slim live squashfs — expect apt and a download here).
  - command: "mkdir -p /var/log && /usr/local/sbin/gamebian-install-steam >>/var/log/gamebian-install-steam.log 2>&1 || true"
  # Gamescope autologin even if the client download did not finish (Steam updates inside gamescope).
  - command: "/usr/sbin/gamebian-enable-steam-lightdm-session >>/var/log/gamebian-install-steam.log 2>&1 || true"
  # gamescope: shellprocess@gamebian-gamescope (7200s) — not here (60s timeout kills source build).
  - command: "[ -x /usr/games/gamescope ] && [ ! -e /usr/bin/gamescope ] && ln -sf ../games/gamescope /usr/bin/gamescope || true"
  - command: "[ -x /usr/games/steam ] && [ ! -e /usr/bin/steam ] && ln -sf ../games/steam /usr/bin/steam || true"
  # OpenSSH: install if missing, host keys, enable ssh.socket (socket activation).
  - command: "chmod 0755 /usr/local/sbin/gamebian-enable-sshd-installed 2>/dev/null || true"
  - command: "/usr/local/sbin/gamebian-enable-sshd-installed --from-calamares"
  - command: "systemctl enable gamebian-sshd-installed-enable.service 2>/dev/null || true"
