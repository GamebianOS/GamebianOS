backend: apt

update_db: true
update_system: false

operations:
  - try_remove:
      - live-boot-initramfs-tools
      - live-task-localisation
      - live-task-recommended
      - qml-module-qtquick-controls2
      - plymouth
      - plymouth-label
      - plymouth-themes
      - plymouth-x11
      # Desktop chrome. try_remove so a package that was never on this image does not fail the install.
      - lxpanel
      - lxappearance
      - lxappearance-obconf
      - lxrandr
      - rofi
      - feh
      - thunar
      - xfce4-terminal
      - xfce4-notifyd
      - libnotify-bin
      - pavucontrol
      - zenity
      - blueman
      - network-manager-applet
      - nm-connection-editor
      - papirus-icon-theme
      - desktop-base
      - qt5-gtk-platformtheme
      - qt6-gtk-platformtheme
      - qt6ct
  - remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - calamares
      # Live ISO uses Openbox only to host Calamares.
      - openbox
  # Slim live squashfs omits Steam — install onto the target disk.
  # OpenSSH: hard install (not try_*) — installed systems must have ssh/sshd.
  - install:
      - openssh-server
      - openssh-client
  - try_install:
      - steam-installer
      - steam-devices
      # Explicit: live-build sets APT::Install-Recommends false, so Steam/gamescope
      # never pull RADV/ANV. Without this, gamescope falls back to llvmpipe and dies.
      - mesa-vulkan-drivers
      - network-manager
      - bluez
      - mate-polkit
      - gnome-keyring
      - libpam-gnome-keyring
      - x11-xserver-utils
      - xserver-xorg
      - e2fsprogs
      - dosfstools
      - parted
      - gamescope
      - xwayland
