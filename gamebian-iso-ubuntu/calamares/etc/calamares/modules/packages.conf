backend: apt

update_db: true
update_system: false

operations:
  - try_remove:
      - live-boot-initramfs-tools
      - live-task-localisation
      - live-task-recommended
      - qml-module-qtquick-controls2
      - plymouth
      - plymouth-label
      - plymouth-themes
      - plymouth-x11
  - remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - calamares
  - try_install:
      - steam-installer
      - openssh-server
      - openssh-client
      - network-manager
      - nm-tray
      - nm-connection-editor
      - blueman
      - bluez
      - mate-polkit
      - gnome-keyring
      - libpam-gnome-keyring
      - qt5-gtk-platformtheme
      - qt6-gtk-platformtheme
      - papirus-icon-theme
      - lxrandr
      - x11-xserver-utils
      - gamescope
