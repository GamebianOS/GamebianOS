# Configuration file for Calamares
# Syntax is YAML 1.2
# Derived from calamares-settings; branding points at GamebianUbuntu overlay.
---

modules-search: [ local, /usr/lib/calamares/modules, /usr/lib/x86_64-linux-gnu/calamares/modules ]

# Named shellprocess instances; sequence references ids below.
instances:
- id: gamebian-sshprep
  module: shellprocess
  config: shellprocess_gamebian_sshprep.conf
- id: gamebian-network
  module: shellprocess
  config: shellprocess_gamebian_network.conf
- id: gamebian-apt-sources
  module: shellprocess
  config: shellprocess_gamebian_apt_sources.conf
- id: gamebian-web
  module: shellprocess
  config: shellprocess_gamebian_web.conf
- id: gamebian-gamescope
  module: shellprocess
  config: shellprocess_gamebian_gamescope.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - shellprocess@gamebian-network
  - hwclock
  - services-systemd
  - bootloader-config
  # Ubuntu live squashfs already carries archive.ubuntu.com sources; enable gaming repos next.
  - shellprocess@gamebian-apt-sources
  - packages
  - shellprocess@gamebian-sshprep
  - shellprocess@gamebian-gamescope
  - services-systemd
  - grubcfg
  - bootloader
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  # Install gamebian-web (web-based remote install/manage tool) on the target.
  # Source is staged at /usr/src/gamebian-web from repo Packages/gamebian-web (gamebian-iso-ubuntu/setup.sh);
  # this shellprocess installs it via pip + apt and enables its systemd units.
  # The live ISO never enables or runs gamebian-web.
  - shellprocess@gamebian-web
  - umount
- show:
  - finished

branding: gamebian

prompt-install: false
dont-chroot: false
