# Gamebian Calamares partition module (Debian + Ubuntu keep in sync).
# Erase creates a formatted ext4 root. Do NOT set partitionLayout "name" —
# that is a GPT-only partition name; on BIOS/MBR (common in VirtualBox) KPMCore
# then emits "Partition table … does not support setting names".
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 300MiB
  minimumSize: 32MiB
  label: "EFI"

userSwapChoices:
  - none
  - small
  - suspend

initialPartitioningChoice: erase
initialSwapChoice: none

luksGeneration: luks1
defaultFileSystemType: "ext4"
drawNestedPartitions: false
alwaysShowPartitionLabels: true

requiredStorage: 10

lvm:
  enable: false

partitionLayout:
  - filesystem: "ext4"
    mountPoint: "/"
    size: "100%"
